<!DOCTYPE html>
<html>
<head>
    <title>Project-Aran Dashboard</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; }
        tr:nth-child(even){background-color: #f2f2f2;}
        tr:hover {background-color: #ddd;}
        th { background-color: #4CAF50; color: white; }
        .priority1 { background-color: #ffcccc; }
    </style>
</head>
<body>
<h2>Project-Aran Snort Dashboard</h2>

<form method="get">
  Priority:
  <select name="priority">
    <option value="">All</option>
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3">3</option>
  </select>
  Classification:
  <select name="classification">
    <option value="">All</option>
    <option value="Potentially Bad Traffic">Potentially Bad Traffic</option>
    <option value="Web attack">Web attack</option>
  </select>
  <button type="submit">Filter</button>
</form>

<table>
<tr><th>Time</th><th>Src</th><th>Dst</th><th>Message</th><th>Priority</th><th>Classification</th></tr>
{% for alert in alerts %}
<tr {% if alert.priority == 1 %}class="priority1"{% endif %}>
  <td>{{ alert.timestamp | datetimeformat }}</td>
  <td>{{ alert.src }}</td>
  <td>{{ alert.dst }}</td>
  <td>{{ alert.msg }}</td>
  <td>{{ alert.priority }}</td>
  <td>{{ alert.classification }}</td>
</tr>
{% endfor %}
</table>

</body>
</html>
