[snort]
# Path to the Snort FAST alert log
log_file = /home/cavin/Desktop/Project-Aran/snort_monitor/logs/alert_system.log

[alerting]
# Enable/disable Twilio SMS and Telegram
sms_enabled = true
telegram_enabled = true

# Priority threshold for immediate SMS (lower number = higher priority)
# Only high-priority alerts (1) will trigger SMS
sms_priority_threshold = 1

# List of classifications considered critical for immediate SMS
critical_classifications = web application attack, shellcode attempt, dos attack

# Minimum seconds between SMS for the same SID+SRC (debounce)
sms_debounce_seconds = 3600

# Maximum SMS allowed per hour
sms_global_limit_per_hour = 10

# Interval (seconds) to send batched queued alerts
sms_batch_window_seconds = 300

# Telegram alerts can include medium and high-priority alerts
telegram_priority_min = 2

[twilio]
account_sid = YOUR_TWILIO_ACCOUNT_SID
auth_token = YOUR_TWILIO_AUTH_TOKEN
from_number = +1XXXXXXXXXX
to_number = +94XXXXXXXXX

[telegram]
bot_token = YOUR_TELEGRAM_BOT_TOKEN
chat_id = YOUR_TELEGRAM_CHAT_ID

